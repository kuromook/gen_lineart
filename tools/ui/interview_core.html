<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聞き取り</title>
<style>
/* 指針: doc/ui_guidelines_20261107.md。この核はサーバー版と artifact 版で共通。 */
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--sub:#5d5d58;--line:#d9d9d3;--accent:#1f5fbf;--target:#d1342f;--sel:#e7eefb;--warn:#8a5a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#20201f;--ink:#ecece8;--sub:#a5a59e;--line:#3a3a37;--accent:#7aa7ff;--target:#ff6b63;--sel:#22314d;--warn:#e0b050}}
:root[data-theme="dark"]{--bg:#161615;--panel:#20201f;--ink:#ecece8;--sub:#a5a59e;--line:#3a3a37;--accent:#7aa7ff;--target:#ff6b63;--sel:#22314d;--warn:#e0b050}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#q{font-size:18px;font-weight:700;margin:0}
#meta{color:var(--sub);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;margin-top:2px}
#decides{color:var(--sub);font-size:13px;margin-top:2px}
#note{font-size:13px;margin-top:4px}
main{flex:1;min-height:0;display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;align-content:stretch}
.pane{flex:1 1 280px;min-width:200px;min-height:200px;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.pane.target{border-color:var(--target)}
.pane.dim .view{opacity:.25}
.cap{font-size:13px;padding:3px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.pane.target .cap b{color:var(--target)}
.view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:repeating-conic-gradient(#0000 0 25%,#8881 0 50%) 0 0/16px 16px}
.view img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto;user-select:none;-webkit-user-drag:none;max-width:none}
footer{padding:8px 16px 12px;border-top:1px solid var(--line);background:var(--panel)}
#choices{display:flex;flex-wrap:wrap;gap:8px}
.ch{min-height:44px;min-width:44px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.ch kbd{display:inline-block;min-width:1.4em;text-align:center;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px;font-size:12px;color:var(--sub)}
.ch small{display:block;color:var(--sub);font-size:12px}
.ch.on{background:var(--sel);border-color:var(--accent)}
.ch.builtin{border-style:dashed}
#row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
#comment{flex:1 1 260px;min-height:44px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button.nav{min-height:44px;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
#status{color:var(--sub);font-size:12px;margin-top:6px}
#status.err{color:var(--warn)}
#keys{color:var(--sub);font-size:12px}
#overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
#overlay .box{background:var(--panel);color:var(--ink);border-radius:8px;padding:20px;max-width:520px}
@media (max-width:600px){main{padding:8px}header,footer{padding-left:16px;padding-right:16px}}
.view img.px{image-rendering:pixelated}
#zoomlbl.small{color:var(--warn)}
</style>
</head>
<body>
<header>
  <p id="q"></p>
  <div id="decides"></div>
  <div id="meta"><span id="progress"></span><span id="zoomlbl"></span><span id="keys">数字=選ぶ / Enter=保存して次へ / ←=前へ / +・−・ホイール・ピンチ=拡大縮小 / 0=収める / Shift+1=等倍 / d=対象以外を薄く</span><span><button class="nav" id="fitbtn" style="min-height:32px">収める</button> <button class="nav" id="natbtn" style="min-height:32px">等倍</button></span></div>
  <div id="note"></div>
</header>
<main id="panes"></main>
<footer>
  <div id="choices"></div>
  <div id="row2">
    <textarea id="comment" rows="1" placeholder="一言(任意。どの答えにも添えられます)"></textarea>
    <button class="nav" id="prev">← 前へ</button>
    <button class="nav primary" id="next" disabled>保存して次へ (Enter)</button>
  </div>
  <div id="status"></div>
</footer>
<div id="overlay"><div class="box" id="ovbox"></div></div>
<script>
// ---- データ: 組み立て器がここを置き換える。器具の用語を画面に出さないのは問いの作り手の仕事 ----
const DATA = /*__INTERVIEW_DATA__*/null;
const MODE = /*__INTERVIEW_MODE__*/"server";   // "server" | "artifact"
const UI_VERSION = "interview_core 2026-11-07";

// 「どれでもない」「分からない」は外せない(指針 §2-1)
const BUILTIN = [
  {value:"__none__", label:"どれでもない", help:"当てはまる選択肢が無い(一言を添えてください)", builtin:true},
  {value:"__unknown__", label:"分からない", help:"判断できない・保留", builtin:true},
];
const CHOICES = DATA.choices.concat(BUILTIN).map((c,i)=>({...c, key: i<9 ? String(i+1) : null}));
const SESSION = Math.random().toString(36).slice(2,10);
const $ = id=>document.getElementById(id);

// ---- 保存先: どちらも追記だけ(指針 §6-1) ----
const store = MODE==="server" ? {
  async load(){ const r=await fetch("api/answers"); if(!r.ok) throw new Error("読み込み失敗 "+r.status); return r.json(); },
  async append(row){ const r=await fetch("api/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(row)}); if(!r.ok) throw new Error("保存失敗 "+r.status); },
} : {
  db:null,
  async ready(){ if(this.db) return this.db; const c=window.claude; this.db = c && c.use ? await c.use("db") : null; if(!this.db) throw new Error("保存先(db)に繋がらない —— この画面では答えを保存できません"); return this.db; },
  async load(){ const db=await this.ready(); const s=await db.collection("answers").where("interview_id","==",DATA.interview_id).get(); return s.docs.map(d=>d.data()); },
  async append(row){ const db=await this.ready(); await db.collection("answers").add(row); },
};

// ---- 状態 ----
let idx=0, sel=null, answers={}, savedThisSession=0, dimOthers=false, busy=false;
const latest = rows => { const m={}; rows.sort((a,b)=>(a.ts<b.ts?-1:1)).forEach(r=>{m[r.item_id]=r;}); return m; };

// ---- 絵: 画面に収めて始め、拡大は補間しない(指針 §3) ----
let view = {z:1, cx:.5, cy:.5};  // z = 収めた倍率に掛ける倍数、(cx,cy) = 中心(絵の割合)
const panes=[];
function fitScale(p){ const r=p.view.getBoundingClientRect(); return Math.min(r.width/p.w, r.height/p.h); }
function apply(){
  panes.forEach(p=>{ if(!p.w) return;
    const r=p.view.getBoundingClientRect(), s=fitScale(p)*view.z;
    const x=r.width/2 - view.cx*p.w*s, y=r.height/2 - view.cy*p.h*s;
    p.img.style.transform=`translate(${x}px,${y}px) scale(${s})`;
    // 拡大は補間しない(画素をそのまま)。縮小で補間を止めると細い線が途切れて見えるので、縮小は滑らかに縮める
    p.img.classList.toggle("px", s>=1);
    p.scaleLbl.textContent = Math.round(s*100)+"%";
  });
  const p=panes[0]; if(p&&p.w){ const s=fitScale(p)*view.z, L=$("zoomlbl");
    L.textContent="倍率 "+Math.round(s*100)+"%(全部の絵に同じ拡大)"+(s<1?" —— 縮小中: 細い線は薄く・途切れて見えます。線の有無は等倍(Shift+1)で":"");
    L.classList.toggle("small", s<1); }
}
function zoomAt(p, factor, px, py){ // (px,py) = 窓の中の画面座標。そこを動かさずに拡大する
  const r=p.view.getBoundingClientRect(), s0=fitScale(p)*view.z;
  const ix=(px - (r.width/2 - view.cx*p.w*s0))/s0, iy=(py - (r.height/2 - view.cy*p.h*s0))/s0;
  view.z=Math.min(64,Math.max(.1,view.z*factor)); const s1=fitScale(p)*view.z;
  view.cx=(ix - (px - r.width/2)/s1)/p.w; view.cy=(iy - (py - r.height/2)/s1)/p.h; apply();
}
function setNative(){ const p=panes[0]; if(p&&p.w){ view.z=1/fitScale(p); apply(); } }
function setFit(){ view={z:1,cx:.5,cy:.5}; apply(); }
function bindView(p){
  const pts=new Map(); let last=null, pinch=null;
  p.view.addEventListener("wheel",e=>{e.preventDefault(); const r=p.view.getBoundingClientRect(); zoomAt(p, e.deltaY<0?1.25:0.8, e.clientX-r.left, e.clientY-r.top);},{passive:false});
  p.view.addEventListener("pointerdown",e=>{p.view.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); last={x:e.clientX,y:e.clientY}; if(pts.size===2){const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});
  p.view.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=p.view.getBoundingClientRect(); zoomAt(p, d/pinch.d, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top); pinch.d=d; return; }
    if(pts.size===1&&last){ const s=fitScale(p)*view.z; view.cx-=(e.clientX-last.x)/(p.w*s); view.cy-=(e.clientY-last.y)/(p.h*s); last={x:e.clientX,y:e.clientY}; apply(); }});
  const up=e=>{pts.delete(e.pointerId); if(pts.size<2) pinch=null; const rest=[...pts.values()][0]; last=rest?{...rest}:null;};
  p.view.addEventListener("pointerup",up); p.view.addEventListener("pointercancel",up);
}

// ---- 描く ----
function render(){
  const it=DATA.items[idx];
  $("q").textContent = (it.question || DATA.question) + (DATA.unit ? `(答える単位: ${DATA.unit})` : "");
  $("decides").textContent = DATA.decides ? "この答えで決まること: "+DATA.decides : "";
  $("note").textContent = it.note || "";
  const done=Object.keys(answers).length;
  $("progress").textContent = `${idx+1} / ${DATA.items.length} 問目 ・ 答えた ${done} / 残り ${DATA.items.length-done}`;
  const box=$("panes"); box.innerHTML=""; panes.length=0;
  it.images.forEach(im=>{
    const pane=document.createElement("div"); pane.className="pane"+(im.target?" target":"")+(dimOthers&&!im.target&&it.images.some(x=>x.target)?" dim":"");
    const cap=document.createElement("div"); cap.className="cap";
    const t=document.createElement("span"); t.innerHTML = im.target ? "<b>● 問う対象</b> " : ""; t.append(im.caption||"");
    const sl=document.createElement("span"); cap.append(t,sl);
    const v=document.createElement("div"); v.className="view";
    const img=document.createElement("img"); img.alt=im.caption||""; img.draggable=false; v.append(img);
    pane.append(cap,v); box.append(pane);
    const p={view:v,img,scaleLbl:sl,w:0,h:0}; panes.push(p); bindView(p);
    img.onload=()=>{p.w=img.naturalWidth; p.h=img.naturalHeight; apply();};
    img.src = im.src;
  });
  const prev=answers[it.id]; sel = prev ? prev.value : null; $("comment").value = prev ? (prev.comment||"") : "";
  renderChoices(); $("prev").disabled = idx===0;
  $("status").className=""; $("status").textContent = prev ? `前の答え: ${prev.label}(${prev.ts.slice(0,16).replace("T"," ")})。選び直すと新しい行として足されます(前の行は消えません)` : "";
}
function renderChoices(){
  const box=$("choices"); box.innerHTML="";
  CHOICES.forEach(c=>{ const b=document.createElement("button"); b.className="ch"+(c.builtin?" builtin":"")+(sel===c.value?" on":"");
    if(c.key){const k=document.createElement("kbd"); k.textContent=c.key; b.append(k);} b.append(c.label);
    if(c.help){const s=document.createElement("small"); s.textContent=c.help; b.append(s);}
    b.onclick=()=>{sel=c.value; renderChoices();}; box.append(b); });
  $("next").disabled = sel===null || busy;
}
async function saveNext(){
  if(sel===null||busy) return; const it=DATA.items[idx], c=CHOICES.find(x=>x.value===sel);
  const row={interview_id:DATA.interview_id, item_id:it.id, item_version:it.version||null,
    images:it.images.map(i=>i.id||i.caption||""), value:c.value, label:c.label, comment:$("comment").value.trim(),
    ts:new Date().toISOString(), ui_version:UI_VERSION, session:SESSION, mode:MODE};
  busy=true; renderChoices(); $("status").textContent="保存中…";
  try{ await store.append(row); answers[it.id]=row; savedThisSession++; }
  catch(e){ busy=false; renderChoices(); $("status").className="err"; $("status").textContent=e.message+" —— 答えはまだ保存されていません。もう一度 Enter を押してください"; return; }
  busy=false;
  const bs=DATA.batch_size||0;  // 既定は区切らない(2026-11-07 作者「不要」)。問いの側で batch_size を書いたときだけ
  if(Object.keys(answers).length===DATA.items.length){ return finish(); }
  if(bs>0 && savedThisSession%bs===0){ return pause(); }
  idx=nextIndex(idx); view={z:1,cx:.5,cy:.5}; render();
}
function nextIndex(i){ for(let k=1;k<=DATA.items.length;k++){const j=(i+k)%DATA.items.length; if(!answers[DATA.items[j].id]) return j;} return Math.min(i+1,DATA.items.length-1); }
function overlay(html, btns){ $("ovbox").innerHTML=html; btns.forEach(([t,f])=>{const b=document.createElement("button"); b.className="nav primary"; b.style.marginRight="8px"; b.textContent=t; b.onclick=()=>{$("overlay").style.display="none"; f&&f();}; $("ovbox").append(b);}); $("overlay").style.display="flex"; }
function pause(){ overlay(`<p><b>ここで一区切りです。</b>答えはすべて保存されています。</p><p>残り ${DATA.items.length-Object.keys(answers).length} 問。いつでも閉じて、後で開けば続きから始まります。</p>`, [["続ける",()=>{idx=nextIndex(idx); render();}]]); }
function finish(){ overlay(`<p><b>全部答え終わりました。</b>ありがとうございました。</p><p>前の問いに戻って見直すこともできます(直すと新しい行として足されます)。</p>`, [["見直す",()=>render()]]); }

// ---- キー(指針 §4-1)。文字を打っている間は止める ----
document.addEventListener("keydown",e=>{
  if($("overlay").style.display==="flex"){ if(e.key==="Enter"){e.preventDefault(); $("ovbox").querySelector("button")?.click();} return; }
  const typing = document.activeElement===$("comment");
  if(typing){ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); saveNext();} if(e.key==="Escape") $("comment").blur(); return; }
  const c=CHOICES.find(x=>x.key===e.key);
  if(c){ sel=c.value; renderChoices(); return; }
  if(e.key==="Enter"){ e.preventDefault(); saveNext(); }
  else if(e.key==="ArrowLeft"){ if(idx>0){idx--; view={z:1,cx:.5,cy:.5}; render();} }
  else if(e.key==="+"||e.key===";"){ const p=panes[0]; if(p){const r=p.view.getBoundingClientRect(); zoomAt(p,1.25,r.width/2,r.height/2);} }
  else if(e.key==="-"){ const p=panes[0]; if(p){const r=p.view.getBoundingClientRect(); zoomAt(p,.8,r.width/2,r.height/2);} }
  else if(e.key==="0"){ setFit(); }
  else if(e.key==="d"){ dimOthers=!dimOthers; render(); }
});
// 1 は選択肢と被るので、等倍はボタンと Shift+1(!)でも取れるようにする
document.addEventListener("keydown",e=>{ if(e.key==="!" && document.activeElement!==$("comment")) setNative(); });
$("next").onclick=saveNext; $("fitbtn").onclick=setFit; $("natbtn").onclick=setNative; $("prev").onclick=()=>{ if(idx>0){idx--; view={z:1,cx:.5,cy:.5}; render();} };
window.addEventListener("resize",apply);

(async()=>{
  render(); $("status").textContent="前の答えを読み込み中…";
  try{ answers=latest(await store.load()); idx=nextIndex(-1); render();
       if(Object.keys(answers).length===DATA.items.length) finish(); }
  catch(e){ $("status").className="err"; $("status").textContent=e.message; }
})();
</script>
</body>
</html>
