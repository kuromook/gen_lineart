<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>分解の台</title>
<style>
  :root { --bg:#17191c; --fg:#e9e9ea; --line:#34373c; --hot:#ff8a2b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  body { display:flex; flex-direction:column; overscroll-behavior:none; }
  #bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 8px;
         border-bottom:1px solid var(--line); }
  #stage { flex:1; position:relative; overflow:hidden; touch-action:none; background:#0d0e10; }
  #stage canvas { position:absolute; left:0; top:0; transform-origin:0 0;
                  image-rendering:pixelated; }
  /* **重ね方を変えない(normal)。** 切り出しは面を「淡い橙 50%」で塗ってあるので、
     screen で重ねると **青 + 淡い橙 = ピンク**になり、**札の色と画面の色が食い違った**
     (2026-11-08、作者「画面上の絵の面はピンクだがUI側は青」)。
     いまは**不透明で塗り、面の中の線だけ暗く残す** —— 札の色とまったく同じ色が出る */
  #hint { padding:6px 8px; border-radius:8px; font-size:15px; font-weight:700; }
  #hint.many { background:#123d24; color:#8bd450; }
  #hint.one  { background:#3d2f12; color:#ffd166; }
  #stage.pan  { cursor:grab; }
  #stage.cut  { cursor:crosshair; }
  #stage.paint{ cursor:crosshair; }
  #ring { position:absolute; border-radius:50%; pointer-events:none; display:none;
          box-sizing:border-box; transform:translate(-50%,-50%); }
  #how { padding:5px 8px; font-size:14px; border-top:1px solid var(--line);
         background:#1b1e22; }
  #mCut.on { background:#ff2b4d; border-color:#ff2b4d; color:#fff; }
  #side { border-top:1px solid var(--line); padding:6px 8px; max-height:30vh; overflow:auto; }
  body.wide #side, body.wide #how, body.wide #big { display:none; }
  button { font:inherit; color:var(--fg); background:#262a2f; border:1px solid var(--line);
           border-radius:8px; padding:7px 11px; }
  button.on { background:var(--hot); color:#17191c; border-color:var(--hot); font-weight:700; }
  button:disabled { opacity:.4; }
  .part { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .sw { width:20px; height:20px; border-radius:5px; border:1px solid #0006; flex:0 0 auto; }
  input[type=text] { flex:1; min-width:0; font:inherit; color:var(--fg); background:#1d2024;
                     border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin:3px 0 7px; }
  .chips button { padding:4px 8px; font-size:13px; }
  .muted { color:#9aa0a6; font-size:13px; }
  #big { display:flex; gap:6px; padding:6px 8px; border-top:1px solid var(--line); }
  #big button { flex:1; padding:12px 8px; }
  #save { background:#1f6f3f; border-color:#2b8a50; font-weight:700; }
  #note { padding:0 8px 6px; }
</style>

<div id="bar">
  <button id="prev">◀</button><b id="pos" class="muted"></b><button id="next">▶</button>
  <span style="width:10px"></span>
  <button id="mPan" class="on">移動</button>
  <button id="mCut">切る</button>
  <button id="mPaint">ぬる</button>
  <span class="muted">筆の太さ</span><input id="w" type="range" min="2" max="60" value="8" style="width:92px">
  <b id="wv" class="muted">8</b>
  <span style="width:10px"></span>
  <button id="zout">−</button><b id="zv" class="muted">100%</b><button id="zin">＋</button>
  <button id="wide">絵を広く</button><button id="fit">画面に収める</button><button id="one">原寸</button><button id="undo">戻す</button>
</div>

<div id="stage" class="pan"><canvas id="cv"></canvas><canvas id="ov"></canvas><canvas
  id="mk"></canvas><div id="ring"></div></div>
<div id="how"></div>

<div id="side">
  <div class="muted" id="hint">「切る」で繋がってしまった所に線を引くと、面が分かれます。分かれた所に名前を付けてください。</div>
  <div id="saved" class="muted" style="margin:5px 0;color:#8bd450"></div>
  <div id="act" class="muted" style="margin:5px 0"></div>
  <div id="parts"></div>
  <div class="chips" id="chips"></div>
  <div id="note"><input id="comment" type="text" placeholder="気づいたこと(任意)"></div>
</div>

<div id="big">
  <button id="whole">このままで1つ</button>
  <button id="unk">分からない</button>
  <button id="save">保存して次へ</button>
</div>

<script>
const UNITS = /*__UNITS__*/null;
const COL = ['#ff7a18','#00b7ff','#2bd94a','#ff2bd0','#ffe100','#00e5c0',
             '#9b6bff','#ff5a5a','#7fff2b','#2b7bff','#ff9ad5','#c8ff00'];
let parts9 = [];                       // 絵の上に出す番号(札と同じ番号)
const CHIPS = ['線画に流れ込んだ分','コマ枠線','影','髪','衣類','書き文字','黒消し','矩形','リボンの線','背景のベタ'];
const stage = document.getElementById('stage'), cv = document.getElementById('cv'),
      ov = document.getElementById('ov'), mk = document.getElementById('mk'),
      ring = document.getElementById('ring'),
      cx = cv.getContext('2d'), ox = ov.getContext('2d'), mx = mk.getContext('2d');
// **切った跡は画素では 1〜2 画面画素しかなく見えない。** だから筆の跡そのものを
// **画面上で必ず 4 画素以上の太さ**で重ねて描く(登録の問いには関係しない。見え方だけ)
let cutPaths = [], painting = null;
const MODEC = {cut:'#ff2b4d', paint:'#ff8a2b', pan:'#9aa0a6'};
const HOW = {
  pan:  '**移動**: 指やマウスで絵を動かします。2本指でつまむと拡大。',
  cut:  '**切る**: 繋がってしまった所を**なぞると、そこが赤くなって面が切れます**。' +
        '切り終えると面が色分けされます。細い所は拡大してからなぞってください。',
  paint:'**ぬる**: なぞった所を**いま●が付いている部品に移します**(色が変わります)。' +
        '使い道は2つ —— ①切ると細かく割れすぎたとき、**同じものを1つの部品にまとめる**。' +
        '②離れた2か所(左右の目、2か所の影)を**同じ名前の1つの部品にする**。' +
        '切るのと違い、**面は減りません**。',
};
let i = 0, img = null, W = 0, H = 0;
let face = null, lab = null, pin = null, cut = null, ink = null;
// face: 面の画素 / lab: 部品番号 / pin: 筆で決めた画素 / cut: 作者が切り離した画素
let bb = [0,0,0,0];                                 // 面の囲み(描き直しをここに限る)
let nextId = 1, names = new Map(), active = 1, mode = 'pan', brush = 8;
let view = {s:1, x:0, y:0}, undoStack = [], strokes = 0, t0 = 0, done = {};

const $ = s => document.getElementById(s);
const idxOf = (x,y) => y*W + x;

/* ---------- 読み込み ---------- */
async function load(k) {
  i = (k + UNITS.length) % UNITS.length;
  const fid = UNITS[i];
  $('pos').textContent = `${i+1} / ${UNITS.length}  ${done[fid] ? '済' : ''}`;
  const [im, mk] = await Promise.all([pic(`img/${fid}.png`), pic(`mask/${fid}.png`)]);
  img = im; W = im.naturalWidth; H = im.naturalHeight;
  cv.width = ov.width = mk.width = W; cv.height = ov.height = mk.height = H;
  cx.drawImage(im, 0, 0);
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mc = m.getContext('2d'); mc.drawImage(mk, 0, 0);
  const d = mc.getImageData(0, 0, W, H).data;
  face = new Uint8Array(W*H); lab = new Uint16Array(W*H);
  pin = new Uint8Array(W*H); cut = new Uint8Array(W*H); ink = new Uint8Array(W*H);
  // **面の中の線の墨を覚える。** 切り出しは「線を置いてから面を淡い橙 50% で重ねる」ので、
  // 面の中でも**線の所は暗い**(明るさ ≒ 105 / 線でない所 ≒ 232)。
  // **部品の色で塗りつぶしても線が残る** = 塗りつぶしが流れ込んだ線が見える
  const cd = cx.getImageData(0, 0, W, H).data;
  for (let q = 0, r = 0; q < W*H; q++, r += 4)
    if (cd[r]*0.30 + cd[r+1]*0.59 + cd[r+2]*0.11 < 170) ink[q] = 1;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let p = 0, q = 0; p < W*H; p++, q += 4) if (d[q] > 127) {
    face[p] = 1;
    const y = (p / W) | 0, x = p - y*W;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  bb = [x0, y0, Math.max(1, x1-x0+1), Math.max(1, y1-y0+1)];
  nextId = 1; names = new Map(); undoStack = []; strokes = 0; t0 = Date.now();
  cutPaths = [];
  await restore(fid);
  relabel(); fitView(); paintParts(); setMode(mode);
  $('comment').value = '';
}
/* **前に保存した区分けを戻す。** 地図の PNG の 0 は「切り離した画素」なので、
   そこから `cut` を建て直し、番号と名前を引き継いで `relabel()` に任せる */
async function restore(fid) {
  let row = null;
  try { row = await (await fetch('api/saved/' + fid)).json(); } catch (e) { row = null; }
  $('saved').textContent = '';
  if (!row) return;
  const when = (row.received_at || '').slice(0, 16).replace('T', ' ');
  $('saved').textContent = `前に保存: ${when} / ${
    {split: `${row.n_parts} つに分けた`, whole: 'このままで1つ',
     __unknown__: '分からない'}[row.value] || row.value}`;
  $('comment').value = row.comment || '';
  if (row.value !== 'split' || !row.label_file) return;
  let im;
  try { im = await pic('label/' + row.label_file); } catch (e) { return; }
  if (im.naturalWidth !== W || im.naturalHeight !== H) {
    $('saved').textContent += '(**地図の大きさが合わないので戻せません**)';
    return;
  }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  const byN = new Map((row.parts || []).map(q => [q.n, q]));
  for (let p = 0, q = 0; p < W*H; p++, q += 4) {
    if (!face[p]) continue;
    const v = d[q];
    if (v === 0) { cut[p] = 1; lab[p] = 0; } else { lab[p] = v; }
  }
  // **番号ごとの名前を先に置く** —— `relabel()` が `prev` から引き継ぐ
  for (const [n, q] of byN)
    names.set(n, {name: q.name || '', src: q.name_src || 'restored'});
  nextId = 1 + Math.max(0, ...byN.keys());
}
const pic = src => new Promise((ok, no) => {
  const e = new Image(); e.onload = () => ok(e); e.onerror = no; e.src = src;
});

/* ---------- 連結成分(筆で決めた画素は自分の番号を保つ) ---------- */
function relabel() {
  // **使える画素 = 面の中で、作者が切り離していないもの**。
  // **筆で決めた画素は壁**(= その番号のまま。別の場所を同じ名前で束ねられる)
  const prev = lab.slice(), seen = new Uint8Array(W*H), st = new Int32Array(W*H);
  for (let p = 0; p < W*H; p++) if (!pin[p]) lab[p] = 0;
  for (let p = 0; p < W*H; p++) {
    if (!face[p] || cut[p] || pin[p] || seen[p] || lab[p]) continue;
    const id = nextId++, inherit = prev[p];
    let n = 0; st[n++] = p; seen[p] = 1;
    while (n) {
      const c = st[--n], y = (c / W) | 0, x = c - y*W; lab[c] = id;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x+dx, ny = y+dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const q = ny*W + nx;
        if (seen[q] || !face[q] || cut[q] || pin[q]) continue;
        seen[q] = 1; st[n++] = q;
      }
    }
    const old = names.get(inherit);
    if (old) names.set(id, {...old});
  }
  const live = new Set(); for (let p = 0; p < W*H; p++) if (lab[p]) live.add(lab[p]);
  if (!live.has(active)) active = [...live][0] || 1;
}
function areas() {
  const a = new Map();
  for (let p = 0; p < W*H; p++) if (lab[p]) a.set(lab[p], (a.get(lab[p])||0)+1);
  return a;
}

/* ---------- 描画 ---------- */
function paintParts() {
  const a = areas(), ids = [...a.keys()].sort((x,y) => a.get(y)-a.get(x));
  const [bx, by, bw, bh] = bb;
  const d = ox.createImageData(bw, bh), px = d.data;
  const colOf = {}; ids.forEach((id,k) => colOf[id] = COL[k % COL.length]);
  const rgb = {}; for (const id of ids) {
    const c = colOf[id]; rgb[id] = [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16),
                                   parseInt(c.slice(5,7),16)];
  }
  for (let yy = 0, q = 0; yy < bh; yy++) {
    for (let xx = 0; xx < bw; xx++, q += 4) {
      const p = (by+yy)*W + (bx+xx), id = lab[p];
      if (!id) {
        // **切り離した画素は赤。面の外は何も描かない**
        if (face[p]) {
          const k = ink[p] ? 0.45 : 1, r = cut[p] ? [255,60,90] : [150,150,160];
          px[q]=r[0]*k; px[q+1]=r[1]*k; px[q+2]=r[2]*k; px[q+3]=255;
        }
        continue;
      }
      const c = rgb[id];
      // **線の所だけ暗く = 同じ色のまま。選んでいない部品はさらに落とす**(どれが ● かが分かる)
      const k = (ink[p] ? 0.45 : 1) * (ids.length > 1 && id !== active ? 0.55 : 1);
      px[q]=c[0]*k; px[q+1]=c[1]*k; px[q+2]=c[2]*k; px[q+3]=255;
    }
  }
  ox.clearRect(0, 0, W, H); ox.putImageData(d, bx, by);
  // **番号の置き所(部品の重心)**。札の番号と同じ番号を絵の上にも出す
  parts9 = [];
  const sum = new Map();
  for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
    const p = (by+yy)*W + (bx+xx), id = lab[p];
    if (!id) continue;
    const e = sum.get(id) || [0,0,0]; e[0] += bx+xx; e[1] += by+yy; e[2]++;
    sum.set(id, e);
  }
  ids.forEach((id, k) => {
    const e = sum.get(id);
    if (e) parts9.push({id, n: k+1, x: e[0]/e[2], y: e[1]/e[2], col: colOf[id]});
  });
  const box = $('parts'); box.innerHTML = '';
  for (const id of ids) {
    const row = document.createElement('div'); row.className = 'part';
    const sw = document.createElement('div'); sw.className = 'sw';
    sw.style.background = colOf[id];
    const b = document.createElement('button');
    b.textContent = (id === active ? '●' : '○') + ` ${ids.indexOf(id)+1}`;
    b.onclick = () => { active = id; paintParts(); };
    if (id === active) b.className = 'on';
    const t = document.createElement('input'); t.type = 'text';
    t.placeholder = 'この部分は何か';
    t.value = (names.get(id)||{}).name || '';
    t.oninput = () => names.set(id, {name: t.value, src: 'typed'});
    const n = document.createElement('span'); n.className = 'muted';
    n.textContent = a.get(id).toLocaleString();
    row.append(sw, b, t, n); box.append(row);
  }
  const ch = $('chips'); ch.innerHTML = '';
  for (const c of CHIPS) {
    const b = document.createElement('button'); b.textContent = c;
    b.onclick = () => { names.set(active, {name: c, src: 'chip'}); paintParts(); };
    ch.append(b);
  }
  const h = $('hint');
  h.className = ids.length > 1 ? 'many' : 'one';
  h.textContent = ids.length > 1
    ? `◆ いま ${ids.length} つに分かれています。それぞれに名前を付けて「保存して次へ」。`
    : (cutPaths.length
       ? '● まだ 1 つのままです —— 繋ぎ目を**跨いで**切れていません。'
         .replace(/\*\*/g, '') + '赤い線の両端が面から出るまで引いてください。'
       : '● いまは 1 つの面です。「切る」で繋ぎ目をなぞると分かれます。'
         + '分ける所が無ければ「このままで1つ」。');
  const an = (names.get(active) || {}).name;
  $('act').innerHTML = ids.length
    ? `「ぬる」でなぞった所を移す先: <span class="sw" style="display:inline-block;`
      + `vertical-align:-4px;background:${colOf[active] || '#888'}"></span> `
      + `${an ? '「' + an + '」' : '名前のない部品'}(部品の ○ を押すと移す先が変わります)`
    : '';
  apply();
}
function apply() {
  for (const c of [cv, ov, mk]) c.style.transform =
    `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  drawMarks(); sizeRing();
  $('zv').textContent = (view.s * 100).toFixed(0) + '%';
  if (mode === 'cut') setHow();
}
/* **筆の跡を、画面上で必ず見える太さで重ねる**(拡大率が変わるたび引き直す) */
function drawMarks() {
  if (!mk.width) return;
  mx.clearRect(0, 0, mk.width, mk.height);
  const w = Math.max(brush, 4 / view.s);        // 画面上 4 画素を下回らない
  mx.lineCap = mx.lineJoin = 'round';
  const all = painting && painting.kind === 'paint' ? cutPaths.concat([painting]) : cutPaths;
  for (const pa of all) {
    mx.strokeStyle = pa.kind === 'cut' ? 'rgba(255,43,77,.95)' : 'rgba(255,138,43,.95)';
    mx.lineWidth = Math.max(pa.brush, 4 / view.s);
    mx.beginPath();
    mx.moveTo(pa.pts[0][0], pa.pts[0][1]);
    for (const [x, y] of pa.pts.slice(1)) mx.lineTo(x, y);
    if (pa.pts.length === 1) mx.lineTo(pa.pts[0][0] + .01, pa.pts[0][1]);
    mx.stroke();
  }
  if (parts9.length > 1) {
    const fs = Math.max(26 / view.s, 9);
    mx.font = `700 ${fs}px system-ui,sans-serif`;
    mx.textAlign = mx.textBaseline = 'middle';
    mx.lineWidth = fs / 7;
    for (const q of parts9) {
      mx.strokeStyle = '#000'; mx.strokeText(String(q.n), q.x, q.y);
      mx.fillStyle = q.col;    mx.fillText(String(q.n), q.x, q.y);
    }
  }
}
function sizeRing() {
  const d = Math.max(brush * view.s, 12);
  ring.style.width = ring.style.height = d + 'px';
  ring.style.border = (brush * view.s < 12 ? '2px dashed ' : '2px solid ') + MODEC[mode];
  ring.style.boxShadow = '0 0 0 1px #000a';
  $('wv').textContent = `${brush}画素(画面 ${(brush * view.s).toFixed(1)})`;
}
/* **拡大はここ1か所で行う**(釦・車輪・つまみ・両指が同じ道を通る) */
function zoomAt(k, sx, sy) {
  const r = stage.getBoundingClientRect();
  k = Math.max(0.02, Math.min(24, k));
  const ix = (sx - r.left - view.x) / view.s, iy = (sy - r.top - view.y) / view.s;
  view.s = k;
  view.x = sx - r.left - ix * k;
  view.y = sy - r.top - iy * k;
  apply();
}
function zoomStep(f) {
  const r = stage.getBoundingClientRect();
  zoomAt(view.s * f, r.left + r.width / 2, r.top + r.height / 2);
}
function fitView() {
  const r = stage.getBoundingClientRect();
  view.s = Math.min(r.width/W, r.height/H);
  view.x = (r.width - W*view.s)/2; view.y = (r.height - H*view.s)/2; apply();
}

/* ---------- 筆 ---------- */
function snap(ix) { undoStack.push(ix); if (undoStack.length > 12) undoStack.shift(); }
function stroke(x0, y0, x1, y1, kind) {
  const r = brush/2, steps = Math.max(1, Math.hypot(x1-x0, y1-y0)|0), ch = [];
  for (let s = 0; s <= steps; s++) {
    const cxp = x0 + (x1-x0)*s/steps, cyp = y0 + (y1-y0)*s/steps;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx*dx + dy*dy > r*r) continue;
      const x = Math.round(cxp+dx), y = Math.round(cyp+dy);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const p = idxOf(x,y); if (!face[p]) continue;
      if (kind === 'cut') {
        if (cut[p]) continue;
        ch.push([p, lab[p], pin[p], cut[p]]); lab[p] = 0; pin[p] = 0; cut[p] = 1;
      } else {
        if (cut[p]) continue;                       // **切った画素は筆で戻さない**
        if (lab[p] === active && pin[p] === 1) continue;
        ch.push([p, lab[p], pin[p], cut[p]]); lab[p] = active; pin[p] = 1;
      }
    }
  }
  return ch;
}

/* ---------- 指と筆 ---------- */
const pts = new Map(); let drag = null, pinch = null, pending = [];
function toImg(e) {
  const r = stage.getBoundingClientRect();
  return [(e.clientX - r.left - view.x)/view.s, (e.clientY - r.top - view.y)/view.s];
}
stage.addEventListener('wheel', e => {
  // **マウスの車輪と、画板のつまみ(ctrl つきで来る)。両方ここで受ける**
  e.preventDefault();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022));
  zoomAt(view.s * f, e.clientX, e.clientY);
}, {passive: false});
stage.addEventListener('dblclick', e => zoomAt(view.s * 2, e.clientX, e.clientY));
let heldMode = null;                 // **スペースを押している間だけ移動に切り替える**
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '+' || e.key === '=') zoomStep(1.4);
  if (e.key === '-') zoomStep(1 / 1.4);
  if (e.code === 'Space' && heldMode === null) {
    e.preventDefault();
    heldMode = mode; setMode('pan');
    $('how').innerHTML = '<b>スペースを押している間は移動</b>'
      + '(離すと「' + ({cut:'切る', paint:'ぬる', pan:'移動'})[heldMode] + '」に戻ります)';
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' && heldMode !== null) { setMode(heldMode); heldMode = null; }
});
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e);
  if (e.button === 1 && heldMode === null) {        // **中押しの釦でも移動**
    heldMode = mode; setMode('pan');
    stage.addEventListener('pointerup', function back() {
      if (heldMode !== null) { setMode(heldMode); heldMode = null; }
      stage.removeEventListener('pointerup', back);
    });
  }
  if (pts.size === 2) {
    if (pending.length) {                 // **つまむ前に入った筆を元に戻す**
      for (const [q, l, w, c] of pending) { lab[q] = l; pin[q] = w; cut[q] = c; }
      if (painting) {
        const k = cutPaths.indexOf(painting);
        if (k >= 0) cutPaths.splice(k, 1);
      }
      relabel(); paintParts();
    }
    painting = null;
    const [a,b] = [...pts.values()];
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), s: view.s,
             x: view.x, y: view.y,
             mx: (a.clientX+b.clientX)/2, my: (a.clientY+b.clientY)/2};
    drag = null; pending = [];
    return;
  }
  if (mode === 'pan') { drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y}; return; }
  const [x,y] = toImg(e); drag = {ix: x, iy: y}; pending = [];
  painting = {kind: mode === 'cut' ? 'cut' : 'paint', brush, pts: [[x, y]]};
  if (painting.kind === 'cut') cutPaths.push(painting);
  drawMarks();
});
stage.addEventListener('pointermove', e => {
  if (mode !== 'pan') {
    const r = stage.getBoundingClientRect();
    ring.style.display = 'block';
    ring.style.left = (e.clientX - r.left) + 'px';
    ring.style.top = (e.clientY - r.top) + 'px';
  }
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, e);
  if (pinch && pts.size === 2) {
    const [a,b] = [...pts.values()];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const k = Math.max(0.05, Math.min(16, pinch.s * d/pinch.d));
    const r = stage.getBoundingClientRect();
    const ox0 = (pinch.mx - r.left - pinch.x)/pinch.s, oy0 = (pinch.my - r.top - pinch.y)/pinch.s;
    view.s = k; view.x = pinch.mx - r.left - ox0*k; view.y = pinch.my - r.top - oy0*k;
    apply(); return;
  }
  if (!drag) return;
  if (mode === 'pan') {
    view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y);
    apply(); return;
  }
  const [x,y] = toImg(e);
  const ch = stroke(drag.ix, drag.iy, x, y, mode === 'cut' ? 'cut' : 'paint');
  pending.push(...ch);
  if (painting) { painting.pts.push([x, y]); drawMarks(); }
  drag.ix = x; drag.iy = y;
});
function up(e) {
  pts.delete(e.pointerId);
  painting = null;
  if (pts.size < 2) pinch = null;
  if (!drag || mode === 'pan') { drag = null; return; }
  drag = null;
  if (pending.length) {
    snap({ch: pending, path: mode === 'cut' ? cutPaths[cutPaths.length - 1] : null});
    strokes++;
    if (mode === 'cut') relabel();
    paintParts();
  }
  pending = [];
  drawMarks();
}
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);

/* ---------- 釦 ---------- */
function setMode(m) {
  mode = m;
  for (const [k,id] of [['pan','mPan'],['cut','mCut'],['paint','mPaint']])
    $(id).className = (k === m ? 'on' : '');
  stage.className = m;
  ring.style.display = (m === 'pan' ? 'none' : 'block');
  setHow(); sizeRing();
}
function setHow() {
  $('how').innerHTML = HOW[mode].replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    + (mode === 'cut' && brush * view.s < 6
       ? ' <b style="color:#ff2b4d">いまの拡大率では筆が画面上 '
         + (brush * view.s).toFixed(1) + ' 画素しかありません。'
         + '＋ か「原寸」で拡大してください。</b>' : '');
}
$('wide').onclick = () => {
  document.body.classList.toggle('wide');
  $('wide').className = document.body.classList.contains('wide') ? 'on' : '';
  $('wide').textContent = document.body.classList.contains('wide') ? '下を出す' : '絵を広く';
  apply();
};
$('zin').onclick = () => zoomStep(1.4);
$('zout').onclick = () => zoomStep(1 / 1.4);
$('mPan').onclick = () => setMode('pan');
stage.addEventListener('pointerleave', () => { ring.style.display = 'none'; });
$('mCut').onclick = () => setMode('cut');
$('mPaint').onclick = () => setMode('paint');
$('w').oninput = e => { brush = +e.target.value; sizeRing(); drawMarks(); };
$('fit').onclick = fitView;
$('one').onclick = () => {
  const r = stage.getBoundingClientRect();
  const cxp = (r.width/2 - view.x)/view.s, cyp = (r.height/2 - view.y)/view.s;
  view.s = 1; view.x = r.width/2 - cxp; view.y = r.height/2 - cyp; apply();
};
$('undo').onclick = () => {
  const u = undoStack.pop(); if (!u) return;
  if (u.path) {
    const k = cutPaths.indexOf(u.path);
    if (k >= 0) cutPaths.splice(k, 1);
  }
  for (const [p, l, q, c] of u.ch) { lab[p] = l; pin[p] = q; cut[p] = c; }
  relabel(); paintParts();
};
$('prev').onclick = () => load(i-1);
$('next').onclick = () => load(i+1);

/* ---------- 保存(追記だけ) ---------- */
function labelPng() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), d = g.createImageData(W, H), px = d.data;
  const a = areas(), ids = [...a.keys()].sort((x,y) => a.get(y)-a.get(x));
  const num = {}; ids.forEach((id,k) => num[id] = k+1);
  for (let p = 0, q = 0; p < W*H; p++, q += 4) {
    const v = lab[p] ? num[lab[p]] : 0;
    px[q] = px[q+1] = px[q+2] = v; px[q+3] = 255;
  }
  g.putImageData(d, 0, 0);
  return [c.toDataURL('image/png'), ids, num, a];
}
async function post(value) {
  const [png, ids, num, a] = labelPng();
  const row = {
    interview_id: 'l38_decompose_bench_20261108', item_id: UNITS[i], value,
    parts: ids.map(id => ({n: num[id], name: (names.get(id)||{}).name || '',
                           name_src: (names.get(id)||{}).src || '', area: a.get(id)})),
    n_parts: ids.length, strokes, seconds: Math.round((Date.now()-t0)/1000),
    comment: $('comment').value || '', label_png: value === 'split' ? png : null,
    ts: new Date().toISOString(), ua: navigator.userAgent.slice(0, 120),
  };
  const r = await fetch('api/partition', {method: 'POST', body: JSON.stringify(row)});
  if (!r.ok) { alert('保存できませんでした: ' + r.status); return; }
  done[UNITS[i]] = value;
  const msg = {split: `${row.n_parts} つに分けて保存しました`,
               whole: '「このままで1つ」で保存しました',
               __unknown__: '「分からない」で保存しました'}[value];
  await load(i+1);
  $('saved').textContent = (msg || '保存しました') + ' —— 次へ進みました'
    + (UNITS.length > 1 && (i === 0) ? '(最後まで行ったので最初に戻りました)' : '');
}
$('save').onclick = () => {
  const a = areas(), ids = [...a.keys()];
  if (ids.length < 2) { alert('まだ1つのままです。「切る」で分けるか、「このままで1つ」を押してください。'); return; }
  const noname = ids.filter(id => !((names.get(id)||{}).name));
  if (noname.length && !confirm(`${noname.length} つに名前が付いていません。そのまま保存しますか`)) return;
  post('split');
};
$('whole').onclick = () => post('whole');
$('unk').onclick = () => post('__unknown__');
window.addEventListener('resize', () => apply());

fetch('api/done').then(r => r.json()).then(d => { done = d; }).finally(() => load(0));
</script>
